###############################################################################
# Webiface Revenue OS — Nginx Server Block (Coolify / Traefik-aware)
#
# Routing:
#   /           → React static files (baked into this container)
#   /api/*      → Laravel PHP-FPM (backend:9000)
#   /sanctum/*  → Laravel PHP-FPM (CSRF cookie)
#   /storage/*  → Laravel public storage (mounted app_storage volume)
#
# Uses $proxy_x_forwarded_proto instead of $scheme to correctly pass the
# original client protocol (HTTPS) through the Traefik -> Nginx -> Backend chain.
###############################################################################

server {
    listen 80;
    server_name _;

    # React static files – built and copied into /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # ── Laravel public storage (uploads, recordings, screenshots) ────────────
    # Shared volume with the backend so user-generated files are served.
    location /storage {
        alias /var/www/backend/storage/app/public;
        try_files $uri $uri/ =404;
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Laravel API ──────────────────────────────────────────────────────────
    location /api {
        limit_req zone=api burst=30 nodelay;

        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;

        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  QUERY_STRING    $query_string;

        include        fastcgi_params;

        # Forward real client info (through Traefik)
        fastcgi_param  HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param  HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param  REQUEST_URI            $request_uri;

        fastcgi_connect_timeout  10s;
        fastcgi_send_timeout     60s;
        fastcgi_read_timeout     60s;
        fastcgi_buffering        off;
    }

    # ── Laravel Auth (stricter rate limit) ───────────────────────────────────
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;

        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  QUERY_STRING    $query_string;
        include        fastcgi_params;
        fastcgi_param  HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param  HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param  REQUEST_URI            $request_uri;
        fastcgi_connect_timeout  10s;
        fastcgi_send_timeout     30s;
        fastcgi_read_timeout     30s;
        fastcgi_buffering        off;
    }

    # ── Sanctum / CSRF ───────────────────────────────────────────────────────
    location /sanctum {
        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  QUERY_STRING    $query_string;
        include        fastcgi_params;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param  REQUEST_URI     $request_uri;
        fastcgi_buffering off;
    }

    # ── Static Assets (JS/CSS/images) ────────────────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        try_files $uri =404;
    }

    # ── SPA Fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block dotfiles (.env, .git, etc.) ────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    # ── Health check (used by Docker HEALTHCHECK and Coolify) ────────────────
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
