###############################################################################
# DukanOS — Nginx Server Block (Coolify / Traefik-aware)
#
# Routing:
#   /           → React SPA static files (baked into this container)
#   /api/*      → Laravel 13 PHP-FPM (backend:9000)
#   /sanctum/*  → Laravel Sanctum CSRF cookie
#   /storage/*  → Public storage (mounted dukanos_storage volume)
#
# Uses $proxy_x_forwarded_proto instead of $scheme to correctly pass the
# original client protocol (HTTPS) through the Traefik -> Nginx -> Backend chain.
###############################################################################

server {
    listen 80;
    listen 3000;
    server_name _;

    # React static files – built and copied into /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # ── Normalize unversioned /api/* to /api/v1/* ────────────────────────────
    rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 last;

    # ── Laravel public storage (invoices, receipts, uploads) ──────────────────
    location /storage {
        alias /var/www/backend/storage/app/public;
        try_files $uri $uri/ =404;
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Laravel API ──────────────────────────────────────────────────────────
    location /api {
        limit_req zone=api burst=40 nodelay;

        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;

        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  QUERY_STRING    $query_string;

        include        fastcgi_params;

        fastcgi_param  HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param  HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param  REQUEST_URI            $uri$is_args$args;

        fastcgi_keep_conn        on;
        fastcgi_connect_timeout  10s;
        fastcgi_send_timeout     60s;
        fastcgi_read_timeout     60s;
        fastcgi_buffering        off;
    }

    # ── Laravel Auth Endpoints (Rate limited) ─────────────────────────────────
    location ~ ^/api/(?:v1/)?auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=10 nodelay;

        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  QUERY_STRING    $query_string;
        include        fastcgi_params;
        fastcgi_param  HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param  HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param  REQUEST_URI            $uri$is_args$args;

        fastcgi_keep_conn        on;
        fastcgi_connect_timeout  10s;
        fastcgi_send_timeout     30s;
        fastcgi_read_timeout     30s;
        fastcgi_buffering        off;
    }

    # ── Sanctum CSRF Cookie ───────────────────────────────────────────────────
    location /sanctum {
        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  QUERY_STRING    $query_string;
        include        fastcgi_params;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param  REQUEST_URI            $request_uri;
        fastcgi_keep_conn on;
        fastcgi_buffering off;
    }

    # ── Static Frontend Assets (Cache for 1 year) ─────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        try_files $uri =404;
    }

    # ── React SPA Fallback ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block hidden files (.env, .git, etc.) ────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Health check endpoint ────────────────────────────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
